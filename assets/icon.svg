<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Background/Base Soil -->
  <rect width="16" height="16" fill="#593b25"/>
  
  <!-- Mid Soil details -->
  <rect x="2" y="5" width="3" height="2" fill="#734f34"/>
  <rect x="8" y="7" width="4" height="3" fill="#734f34"/>
  <rect x="1" y="11" width="4" height="2" fill="#734f34"/>
  <rect x="12" y="13" width="2" height="2" fill="#734f34"/>
  <rect x="7" y="14" width="3" height="1" fill="#734f34"/>
  
  <!-- Light clod details -->
  <rect x="3" y="6" width="1" height="1" fill="#8c6546"/>
  <rect x="9" y="8" width="2" height="1" fill="#8c6546"/>
  <rect x="2" y="12" width="1" height="1" fill="#8c6546"/>
  <rect x="13" y="14" width="1" height="1" fill="#8c6546"/>
  <rect x="8" y="14" width="1" height="1" fill="#8c6546"/>
  
  <!-- Crevice shadows -->
  <rect x="5" y="8" width="2" height="1" fill="#3d2616"/>
  <rect x="1" y="9" width="1" height="2" fill="#3d2616"/>
  <rect x="13" y="6" width="1" height="2" fill="#3d2616"/>
  <rect x="10" y="11" width="2" height="1" fill="#3d2616"/>
  <rect x="5" y="13" width="1" height="2" fill="#3d2616"/>
  
  <!-- Grass top base -->
  <rect width="16" height="4" fill="#5e9429"/>
  
  <!-- Grass drop downs -->
  <rect x="0" y="4" width="2" height="2" fill="#5e9429"/>
  <rect x="2" y="4" width="1" height="1" fill="#5e9429"/>
  <rect x="4" y="4" width="2" height="3" fill="#5e9429"/>
  <rect x="6" y="4" width="1" height="1" fill="#5e9429"/>
  <rect x="8" y="4" width="2" height="2" fill="#5e9429"/>
  <rect x="11" y="4" width="1" height="3" fill="#5e9429"/>
  <rect x="12" y="4" width="2" height="1" fill="#5e9429"/>
  <rect x="14" y="4" width="2" height="2" fill="#5e9429"/>
  
  <!-- Grass highlights -->
  <rect width="16" height="1" fill="#75b336"/>
  <rect x="1" y="1" width="2" height="1" fill="#75b336"/>
  <rect x="5" y="2" width="3" height="1" fill="#75b336"/>
  <rect x="11" y="1" width="2" height="1" fill="#75b336"/>
  
  <!-- Grass shadows -->
  <rect x="0" y="5" width="2" height="1" fill="#446b1d"/>
  <rect x="4" y="6" width="2" height="1" fill="#446b1d"/>
  <rect x="8" y="5" width="2" height="1" fill="#446b1d"/>
  <rect x="11" y="6" width="1" height="1" fill="#446b1d"/>
  <rect x="14" y="5" width="2" height="1" fill="#446b1d"/>
  <rect x="0" y="3" width="16" height="1" fill="#446b1d"/>
</svg>
